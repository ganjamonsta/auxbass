# ==============================================================================
# Nginx Configuration for aux.ganj4craft.ru with Maintenance Fallback
# ==============================================================================
# 
# Инструкция по установке:
# 1. Скопируйте файл maintenance.html на ваш сервер/хост Pterodactyl в папку:
#    /var/www/aux_maintenance/maintenance.html
# 
# 2. В конфиг Nginx для aux.ganj4craft.ru добавьте директивы error_page и location:
#
# ==============================================================================

server {
    listen 80;
    listen 443 ssl http2;
    server_name aux.ganj4craft.ru;

    # SSL сертификаты (Let's Encrypt / Certbot)
    # ssl_certificate /etc/letsencrypt/live/aux.ganj4craft.ru/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/aux.ganj4craft.ru/privkey.pem;

    # Директива перехвата ошибок 502/503/504 (когда контейнер Pterodactyl остановлен или перезагружается)
    error_page 502 503 504 = @maintenance;

    # Основной прокси на контейнер Pterodactyl (замените порт на ваш выделенный в панели)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket & Streaming support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Важно: перехватывать ошибки от бэкенда для показа страницы техобслуживания
        proxy_intercept_errors on;
        proxy_connect_timeout 3s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Именованный локейшн для отдачи красивой страницы техобслуживания
    location @maintenance {
        root /var/www/aux_maintenance;
        try_files /maintenance.html =502;
        internal;

        # Не кешировать страницу ошибки
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Разрешить проверку здоровья даже из заглушки
    location /api/health {
        proxy_pass http://127.0.0.1:8000/api/health;
        proxy_connect_timeout 2s;
        proxy_intercept_errors off;
    }
}
