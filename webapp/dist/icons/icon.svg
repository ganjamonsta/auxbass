<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d0a"/>
      <stop offset="50%" stop-color="#0b140f"/>
      <stop offset="100%" stop-color="#050806"/>
    </linearGradient>

    <!-- Neon Green Glow Gradient -->
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00FF88"/>
      <stop offset="50%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#00B0FF"/>
    </linearGradient>

    <!-- Core Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00E676" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base with Border -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Radial Acoustic Pulse Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#00FF88" stroke-opacity="0.08" stroke-width="2"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#00FF88" stroke-opacity="0.12" stroke-width="2"/>
  <circle cx="256" cy="256" r="100" fill="none" stroke="#00FF88" stroke-opacity="0.16" stroke-width="2"/>

  <!-- Glowing Audio Equalizer Waveform Bars -->
  <g filter="url(#glow)">
    <rect x="140" y="210" width="16" height="92" rx="8" fill="url(#neonGreen)"/>
    <rect x="168" y="170" width="16" height="172" rx="8" fill="url(#neonGreen)"/>
    <rect x="196" y="130" width="16" height="252" rx="8" fill="url(#neonGreen)"/>
    <rect x="224" y="90"  width="16" height="332" rx="8" fill="url(#neonGreen)"/>
    <rect x="252" y="70"  width="16" height="372" rx="8" fill="#E8FFF2"/>
    <rect x="280" y="90"  width="16" height="332" rx="8" fill="url(#neonGreen)"/>
    <rect x="308" y="130" width="16" height="252" rx="8" fill="url(#neonGreen)"/>
    <rect x="336" y="170" width="16" height="172" rx="8" fill="url(#neonGreen)"/>
    <rect x="364" y="210" width="16" height="92" rx="8" fill="url(#neonGreen)"/>
  </g>
</svg>
