[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "tg-player"
version = "2.0.0"
description = "Telegram Music Player - Bot + API + Web Player"
requires-python = ">=3.10"
dependencies = [
    "aiogram>=3.4.0",
    "aiohttp>=3.9.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "httpx>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.19.0",
    "alembic>=1.13.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "PyJWT>=2.8.0",
    "mutagen>=1.47.0",
    "Pillow>=10.0.0",
]

[tool.setuptools.packages.find]
include = ["shared*", "bot*", "api*"]
