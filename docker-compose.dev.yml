# ===========================================
#  TG Player - Development Docker Compose
# ===========================================
# Использование:
#   docker compose -f docker-compose.dev.yml up -d
#
# Для разработки: только БД в Docker, остальное локально

services:
  # ═══════════════════════════════════════════
  #  PostgreSQL Database (для локальной разработки)
  # ═══════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    container_name: tg_player_db_dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tg_player_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ═══════════════════════════════════════════
  #  pgAdmin (опционально, для просмотра БД)
  # ═══════════════════════════════════════════
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tg_player_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped
    profiles:
      - tools  # Запускается только с --profile tools

volumes:
  postgres_data_dev:
