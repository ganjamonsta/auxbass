# ===========================================
#  TG Player - Production Docker Compose
# ===========================================
# Использование:
#   docker compose -f docker-compose.prod.yml up -d
#
# Требует: .env файл с продакшен переменными

version: '3.8'

services:
  # ═══════════════════════════════════════════
  #  PostgreSQL Database
  # ═══════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    container_name: tg_player_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-tg_player}
    ports:
      # Порт для локального доступа/миграции (можно убрать после миграции)
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - tg_player_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ═══════════════════════════════════════════
  #  API (FastAPI)
  # ═══════════════════════════════════════════
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: tg_player_api
    env_file:
      - .env
    environment:
      # Переопределяем DATABASE_URL для Docker сети
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-tg_player}
    ports:
      - "${API_PORT:-8000}:8000"
    networks:
      - tg_player_net
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ═══════════════════════════════════════════
  #  Telegram Bot (aiogram)
  # ═══════════════════════════════════════════
  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: tg_player_bot
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-tg_player}
    networks:
      - tg_player_net
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  # ═══════════════════════════════════════════
  #  WebApp (nginx + static)
  # ═══════════════════════════════════════════
  webapp:
    build:
      context: .
      dockerfile: Dockerfile.webapp
    container_name: tg_player_webapp
    ports:
      - "${WEBAPP_PORT:-5173}:80"
    networks:
      - tg_player_net
    depends_on:
      - api
    restart: unless-stopped

networks:
  tg_player_net:
    driver: bridge

volumes:
  postgres_data:
